[project]
name = "research-repo-template"
version = "0.1.0"
description = "Git-native research files, agent skills and deterministic checks"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "markdown-it-py>=3,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
